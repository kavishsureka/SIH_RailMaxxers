services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: railblock
      POSTGRES_USER: railblock
      POSTGRES_PASSWORD: railblock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railblock"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://railblock:railblock@postgres:5432/railblock?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres-data:

